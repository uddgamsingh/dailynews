name: Update news

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours at :15 UTC
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Commit updated data
        run: |
          git config user.name "dailybrief-bot"
          git config user.email "dailybrief-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update news $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed, retrying ($i)..."
            sleep 5
          done
          echo "Push failed after 3 attempts."
          exit 1

name: Update news

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours at :15 UTC (edit to change)
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Commit updated data
        run: |
          git config user.name "dailybrief-bot"
          git config user.email "dailybrief-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news $(date -u +%F\ %H:%M)"
            git push
          fi
